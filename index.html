<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous">
</head>
<body>
  <div class="container my-5 mt-5">
    <h1 class="text-center text-primary">EXPENSE TRACKER</h1>

    <form id="expenseform">
      <input type="text" id="editstatus" hidden>
      <div class="row my-5">
        <div class="col-lg-3">
          <input id="expensename" type="text" placeholder="Expense Name" class="form-control">
        </div>
        <div class="col-lg-2">
          <input id="amount" type="number" placeholder="Amount" class="form-control">
        </div>
        <div class="col-lg-3">
          <select id="category" class="form-control">
            <option value="">Select Category</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Shopping">Shopping</option>
            <option value="Bills">Bills</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="col-lg-2">
          <input id="date" type="date" class="form-control">
        </div>
        <div class="col-lg-2">
          <button type="submit" class="btn btn-primary w-100">Save</button>
        </div>
      </div>
    </form>

    <div class="row my-3">
      <div class="col-lg-4">
        <label class="me-2">Filter by Category:</label>
        <select id="filtercategory" class="form-control d-inline-block w-auto">
          <option value="All">All</option>
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Shopping">Shopping</option>
          <option value="Bills">Bills</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="col-lg-4 text-end">
        <h5>Total Expense: &#8377;<span id="totalamount">0</span></h5>
      </div>
    </div>

    <table class="my-3 table table-bordered table-hover">
      <thead class="table-dark text-light text-center">
        <tr>
          <th>#</th>
          <th>Expense Name</th>
          <th>Amount</th>
          <th>Category</th>
          <th>Date</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="tablebody">
      </tbody>
    </table>
  </div>
</body>
<script src="./main.js"></script>
</html>
